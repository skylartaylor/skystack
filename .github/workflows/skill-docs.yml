name: Skill Docs Freshness
on: [push, pull_request]
jobs:
  check-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run gen:skill-docs
      - run: bun run gen:codex-skills
      - name: Verify generated skill files are committed
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short --untracked-files=all
            echo "Generated skill files are stale or missing. Run the skill generators and commit their outputs."
            exit 1
          fi
